# Integración continua de Pipos Fitness: sintaxis, lint, pruebas unitarias y prueba de humo e2e.
name: CI

on:
  pull_request:
  push:
    branches: [pipos-v2]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Comprobar sintaxis (node --check)
        run: |
          find js api -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
          node --check sw.js

      - name: Lint
        run: npm run lint

      - name: Pruebas unitarias
        run: npm test

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Prueba de humo e2e (con y sin red)
        run: npm run e2e -- --trace off

      - name: Guardar el informe de Playwright si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
