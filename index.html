<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07080F">
  <meta name="robots" content="noindex, nofollow">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Pipos">
  <title>Pipos Fitness</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,600..800&family=Outfit:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/areas.css">
</head>
<body>
  <header class="marca">
    <a href="#hoy" class="logo"><img src="icons/icon.svg" alt="" width="30" height="30"><span>Pipos <b>Fitness</b></span></a>
    <span id="red" class="red" hidden>Sin conexión</span>
  </header>
  <main id="vista" tabindex="-1"></main>
  <nav id="nav" class="nav" aria-label="Secciones"></nav>
  <noscript>Pipos Fitness necesita JavaScript.</noscript>
  <script>
    // Aviso de red: la sesión ya creada funciona sin conexión; crear una nueva usa las reglas.
    function red() { document.getElementById('red').hidden = navigator.onLine !== false; }
    addEventListener('online', red); addEventListener('offline', red); red();
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
