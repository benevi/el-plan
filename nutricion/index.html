<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#06070D">
<title>Nutrición · Pipos Fitness</title>
<link rel="icon" href="../icons/icon-32.png" sizes="32x32">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Sora:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/app.css">
<style>
  main { padding: 16px var(--gutter) 120px; }
  .top { padding-left: var(--gutter); padding-right: var(--gutter); }
  .tabs { position: sticky; top: 0; z-index: 4; background: var(--bg); padding: 8px 0 12px; }
  .meal { display: block; width: 100%; text-align: left; }
  .meal + .meal { margin-top: 8px; }
  .meal .m { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); }
  .qty { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 14px; font-size: 14px; margin-top: 8px; }
  .qty .h { font-size: 11px; text-transform: uppercase; color: var(--text-faint); letter-spacing: .06em; }
  .him { color: var(--him); } .her { color: var(--her); }
  .tgt { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; margin-top: 10px; }
  .tgt b { display: block; font-family: var(--f-head); font-size: 17px; }
  .tgt span { font-size: 11px; color: var(--text-faint); }
  .buy { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .buy input { width: 22px; height: 22px; accent-color: var(--acc); }
  .buy.ok .grow { text-decoration: line-through; color: var(--text-faint); }
  label.f { display: block; font-size: 13px; color: var(--text-dim); margin: 14px 0 6px; }
  ol.pasos { padding-left: 20px; } ol.pasos li + li { margin-top: 6px; }
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; z-index: 20; align-items: flex-end; justify-content: center; }
  .sheet-bg.open { display: flex; }
  .sheet { background: var(--bg-2); width: 100%; max-width: 640px; max-height: 92vh; overflow: auto; border-radius: 20px 20px 0 0; padding: 20px 16px calc(24px + var(--safe-b)); position: relative; }
  .sheet h2 { padding-right: 48px; }
  a.card { text-decoration: none; color: inherit; }
  .sheet-close { position: absolute; right: 12px; top: 12px; }
</style>
</head>
<body>
<header class="top" id="top"></header>
<main id="main"></main>
<div class="sheet-bg" id="sheet"></div>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
